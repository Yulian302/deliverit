version: "2"

run:
  # Also lint integration tests (files with //go:build integration).
  build-tags:
    - integration

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
    - depguard
  settings:
    depguard:
      rules:
        # Shared code must stay generic: it may never depend on a service.
        platform-is-generic:
          files:
            - "**/platform/**"
          deny:
            - pkg: github.com/Yulian302/deliverit/services
              desc: platform/ must not import service code
        # Services talk over RPC/events only, never by importing each other.
        gateway-boundary:
          files:
            - "**/services/gateway/**"
          deny:
            - pkg: github.com/Yulian302/deliverit/services/order
              desc: services must not import each other; use the RPC contract in gen/
        order-boundary:
          files:
            - "**/services/order/**"
          deny:
            - pkg: github.com/Yulian302/deliverit/services/gateway
              desc: services must not import each other; use the RPC contract in gen/
        # Inside a service: business rules and domain types know nothing about
        # transport or storage (handler → service → store). Only rpc.go may
        # import RPC/HTTP code, only store.go the database.
        service-layer-is-pure:
          files:
            - "**/services/*/internal/*/service.go"
            - "**/services/*/internal/*/model.go"
          deny:
            - pkg: net/http
              desc: the service layer must not know about HTTP; that belongs in the rpc/handler layer
            - pkg: connectrpc.com
              desc: the service layer must not know about RPC; map errors in rpc.go
            - pkg: github.com/Yulian302/deliverit/gen
              desc: the service layer uses domain types (model.go), not protobuf messages
            - pkg: github.com/jackc
              desc: the service layer must not know about the database; go through the Store interface
            - pkg: database/sql
              desc: the service layer must not know about the database; go through the Store interface
