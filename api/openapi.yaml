openapi: 3.1.0
info:
  title: DeliverIt public API
  version: 0.1.0
  description: |
    The public REST API, served by the Gateway. Internal services talk
    Connect-RPC (see proto/); this document is what browsers and apps rely on.

    Errors use RFC 9457 problem details (`application/problem+json`) with a
    stable machine-readable `code`. Switch on `code`, never on `detail`.

    Every response carries `X-Request-ID` (yours if well-formed, otherwise
    generated). Every request answers within 5 seconds or gets a 504.

    Authentication: log in as a demo user (`POST /v1/auth/demo-login`), then
    send `Authorization: Bearer <token>`. Routes without a `security` entry
    are public, but a token that is sent must be valid: a bad one is a 401
    on any route.
servers:
  - url: http://localhost:8080
    description: local (make run-gateway)

paths:
  /v1/auth/demo-login:
    post:
      operationId: demoLogin
      summary: Log in as a seeded demo user (no password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              additionalProperties: false
              properties:
                userId: { type: string, format: uuid, example: 0193a1b1-0000-7000-8000-0000000000c1 }
      responses:
        "200":
          description: A signed token (EdDSA JWT) and who it is for.
          content:
            application/json:
              schema:
                type: object
                required: [token, tokenType, expiresAt, user]
                properties:
                  token: { type: string }
                  tokenType: { type: string, enum: [Bearer] }
                  expiresAt: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/User" }
        "400":
          description: 'Body is not {"userId": "..."}. code: invalid_argument'
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: "No demo user with this id. code: not_found"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/auth/me:
    get:
      operationId: me
      summary: Who the token says you are
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: "Missing, invalid or expired token. code: unauthenticated"
          headers:
            WWW-Authenticate: { schema: { type: string, example: 'Bearer realm="deliverit"' } }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/restaurants/{id}/menu:
    get:
      operationId: getMenu
      summary: A restaurant's menu (public)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The restaurant and its items. Prices are minor units (kopecks) of `currency`.
          content:
            application/json:
              schema:
                type: object
                required: [restaurant, currency, items]
                properties:
                  restaurant:
                    type: object
                    required: [id, name]
                    properties: { id: { type: string, format: uuid }, name: { type: string } }
                  currency: { type: string, example: UAH }
                  items: { type: array, items: { $ref: "#/components/schemas/MenuItem" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/orders:
    post:
      operationId: placeOrder
      summary: Place an order (customers)
      description: |
        Idempotent per customer and `Idempotency-Key`. Repeating a request
        with the same key returns the original order (202 again, with
        `Idempotent-Replayed: true`) and never creates a second one, however
        many duplicates race. The order starts in PENDING_PAYMENT; payment
        happens afterwards, so poll `GET /v1/orders/{id}` for progress.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-chosen, unique per order attempt. 1-64 chars of `A-Z a-z 0-9 _ -`.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurantId, items, delivery]
              additionalProperties: false
              properties:
                restaurantId: { type: string, format: uuid }
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: Each menu item at most once; prices come from the menu, never from the client.
                  items:
                    type: object
                    required: [menuItemId, quantity]
                    additionalProperties: false
                    properties:
                      menuItemId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 20 }
                delivery: { $ref: "#/components/schemas/Delivery" }
      responses:
        "202":
          description: The order exists (status PENDING_PAYMENT); payment follows.
          headers:
            Location: { schema: { type: string, example: /v1/orders/0193a1c0-0000-7000-8000-000000000001 } }
            Idempotent-Replayed: { description: '"true" when this is a repeat of an earlier request', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "This Idempotency-Key was used for a different request. code: idempotency_key_reused"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/orders/{id}:
    get:
      operationId: getOrder
      summary: An order you may see (its customer, its restaurant's staff, ops)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The order's current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "No such order, or not yours: the two are indistinguishable. code: not_found"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/restaurants:
    get:
      operationId: listRestaurants
      summary: Restaurants near a point, nearest first
      parameters:
        - name: near
          in: query
          required: true
          description: Search centre as `lat,lng` in degrees (lat −90..90, lng −180..180).
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
          example: 50.4501,30.5234
        - name: radiusKm
          in: query
          required: false
          description: Search radius in km, 0 < radiusKm ≤ 20. Default 5.
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 20
            default: 5
        - name: limit
          in: query
          required: false
          description: Maximum results, 1..50. Default 20.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching restaurants, nearest first (an empty array if none).
          content:
            application/json:
              schema:
                type: object
                required: [restaurants]
                properties:
                  restaurants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Restaurant"
              example:
                restaurants:
                  - id: 0193a1b0-0000-7000-8000-000000000001
                    name: Khreshchatyk Kitchen
                    lat: 50.448
                    lng: 30.522
                    prepMinutes: 15
                    distanceKm: 0.2537
        "400":
          description: "Malformed or out-of-range parameters. code: invalid_argument"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: about:blank
                title: Bad Request
                status: 400
                code: invalid_argument
                detail: near is required, as near=lat,lng
        "502":
          description: "The restaurant service failed. code: upstream_error"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: "The restaurant service is unreachable; retry later. code: upstream_unavailable"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "504":
          description: "The restaurant service did not answer within 5 seconds. code: upstream_timeout"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  responses:
    BadRequest:
      description: "Malformed or invalid input. code: invalid_argument"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: "No such resource. code: not_found"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthenticated:
      description: "Missing, invalid or expired token. code: unauthenticated"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: "Your role can't do this. code: forbidden"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Present in the login response }
        role: { type: string, enum: [customer, restaurant, courier, ops] }
        restaurantId: { type: string, format: uuid, description: Restaurant staff only }
    MenuItem:
      type: object
      required: [id, name, priceMinor, available]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        priceMinor: { type: integer, format: int64, description: Price in minor units (kopecks) }
        available: { type: boolean, description: False means listed but can't be ordered now }
    Delivery:
      type: object
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: { type: number, description: Within 10 km of the restaurant }
        lng: { type: number }
        address: { type: string, description: Free text for the courier }
    Order:
      type: object
      required: [id, customerId, restaurantId, status, items, totalMinor, currency, delivery, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING_PAYMENT, AWAITING_RESTAURANT, PREPARING, READY, PICKED_UP, DELIVERED, CANCELLED, FAILED]
        items:
          type: array
          items:
            type: object
            required: [menuItemId, name, unitPriceMinor, quantity]
            properties:
              menuItemId: { type: string, format: uuid }
              name: { type: string, description: As on the menu when ordered }
              unitPriceMinor: { type: integer, format: int64, description: As on the menu when ordered }
              quantity: { type: integer }
        totalMinor: { type: integer, format: int64 }
        currency: { type: string, example: UAH }
        delivery: { $ref: "#/components/schemas/Delivery" }
        createdAt: { type: string, format: date-time }
        version: { type: integer, description: Starts at 1, bumped on every change }
    Restaurant:
      type: object
      required: [id, name, lat, lng, prepMinutes, distanceKm]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lat: { type: number, description: Latitude in degrees }
        lng: { type: number, description: Longitude in degrees }
        prepMinutes: { type: integer, description: Typical preparation time in minutes }
        distanceKm: { type: number, description: Great-circle distance from `near`, in km }
    Problem:
      description: RFC 9457 problem details, plus a stable `code`.
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, description: 'Always "about:blank" for now' }
        title: { type: string, description: The HTTP status text }
        status: { type: integer }
        code:
          type: string
          enum: [invalid_argument, unauthenticated, forbidden, not_found, idempotency_key_reused, upstream_unavailable, upstream_timeout, upstream_error, internal]
        detail: { type: string, description: Human-readable explanation; never internal details }
